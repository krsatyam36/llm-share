<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LLM Share Client</title>
    <script src="mpegts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        @media(min-width: 768px) { body { flex-direction: row; } }
        
        #video-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; min-height: 20vh; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        #resizer { height: 24px; background: #1e1e1e; cursor: ns-resize; display: flex; justify-content: center; align-items: center; touch-action: none; border-top: 1px solid #333; z-index: 10; }
        #resizer::after { content: ""; width: 40px; height: 4px; background: #555; border-radius: 2px; }

        #ai-container { width: 100%; height: 35vh; background: #1e1e1e; display: flex; flex-direction: column; overflow: hidden; }
        @media(min-width: 768px) {
            #ai-container { width: 400px; height: 100%; border-left: 2px solid #333; }
            #resizer { width: 10px; height: 100%; cursor: ew-resize; border-top: none; }
            #resizer::after { width: 4px; height: 40px; }
        }
        
        #ai-header { padding: 12px; background: #252526; font-weight: bold; border-bottom: 1px solid #333; font-size: 14px; color: #00bcd4; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-group { display: flex; gap: 8px; }
        button { border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
        #switchBtn { background: #444; color: #fff; }
        #switchBtn:active { background: #666; }
        #sendBtn { background: #00bcd4; color: #000; }
        #sendBtn:active { background: #008ba3; }
        #sendBtn:disabled { background: #444; color: #888; cursor: not-allowed; }

        #ai-content { flex: 1; padding: 16px; overflow-y: auto; font-size: 15px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        .status-dot { display: inline-block; width: 8px; height: 8px; background: #4caf50; border-radius: 50%; margin-right: 6px; }
        .thinking { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div id="video-container"><video id="videoElement" autoplay muted playsinline></video></div>
    <div id="resizer"></div>
    <div id="ai-container">
        <div id="ai-header">
            <div><span class="status-dot"></span> Gemma3 Live</div>
            <div class="btn-group">
                <button id="switchBtn">Switch Screen</button>
                <button id="sendBtn">Send</button>
            </div>
        </div>
        <div id="ai-content">
            <p class="thinking">Awaiting evaluation trigger...</p>
        </div>
    </div>

    <script>
        const resizer = document.getElementById('resizer');
        const aiContainer = document.getElementById('ai-container');
        let isResizing = false;
        resizer.addEventListener('mousedown', () => isResizing = true);
        resizer.addEventListener('touchstart', () => isResizing = true);
        window.addEventListener('mousemove', (e) => { if(isResizing && window.innerHeight - e.clientY > window.innerHeight*0.1) aiContainer.style.height = `${window.innerHeight - e.clientY}px`; });
        window.addEventListener('touchmove', (e) => { if(isResizing && window.innerHeight - e.touches[0].clientY > window.innerHeight*0.1) aiContainer.style.height = `${window.innerHeight - e.touches[0].clientY}px`; });
        window.addEventListener('mouseup', () => isResizing = false);
        window.addEventListener('touchend', () => isResizing = false);

        const wsUrl = `ws://${window.location.hostname}:8765`;
        const videoElement = document.getElementById('videoElement');
        const aiContent = document.getElementById('ai-content');
        const sendBtn = document.getElementById('sendBtn');
        const switchBtn = document.getElementById('switchBtn');
        
        let player = null;
        let ws = new WebSocket(wsUrl);
        
        if (mpegts.getFeatureList().mseLivePlayback) {
            player = mpegts.createPlayer({ type: 'mse', isLive: true, url: wsUrl });
            player.attachMediaElement(videoElement);
        }

        sendBtn.addEventListener('click', () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "trigger_eval" }));
                sendBtn.disabled = true;
                sendBtn.innerText = "Evaluating...";
            }
        });

        // Push the switch command back to the server
        switchBtn.addEventListener('click', () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "switch_screen" }));
            }
        });

        ws.onmessage = async function(event) {
            if (typeof event.data === "string") {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "ai_stream_start") {
                        aiContent.innerHTML = '<p class="thinking">Analyzing screen frame...</p>';
                    } else if (msg.type === "ai_token") {
                        if (aiContent.querySelector('.thinking')) aiContent.innerHTML = '';
                        let safeText = msg.text.replace(/\*\*/g, '');
                        safeText = safeText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        aiContent.innerHTML += safeText;
                        aiContent.scrollTop = aiContent.scrollHeight;
                    } else if (msg.type === "ai_stream_end") {
                        sendBtn.disabled = false;
                        sendBtn.innerText = "Send";
                    }
                } catch(e) { }
            }
        };

        ws.onopen = () => { if(player) player.load(); player.play(); };
    </script>
</body>
</html>
